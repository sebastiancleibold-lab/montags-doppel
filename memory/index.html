<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Louises Memory</title>
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f6efe4; --panel: #fffaf2; --ink: #2a2622; --muted: #7b7268; --line: #e6dccd;
  --card: #1f5f68; --card-edge: #123e44; --card-ink: #ffffff;
  --accent: #e9725c; --accent-edge: #b9533f; --accent-soft: #fbe2da;
  --ok: #3f9b6b;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --script: "Snell Roundhand", "Savoye LET", "Brush Script MT", "Segoe Script", cursive;
  --serif: "Iowan Old Style", "Palatino", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1916; --panel: #25221e; --ink: #f1ebe2; --muted: #a89f93; --line: #3a352f;
    --card: #2a7782; --card-edge: #17474e; --accent-soft: #4a2a22; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Spiel ---------- */
#game { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding: calc(var(--st) + 14px) 16px calc(var(--sb) + 16px); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 700 clamp(24px, 7vw, 32px)/1.05 var(--serif); white-space: nowrap; letter-spacing: -0.01em; }
h1 span { display: block; font: 600 13px/1.3 -apple-system, system-ui, sans-serif; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.tools { display: flex; gap: 8px; align-items: center; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line);
  display: grid; place-items: center; flex: none; }
.round-btn:active { transform: scale(.94); }
.round-btn svg { width: 22px; height: 22px; }
.round-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-edge); }
.pill { height: 50px; padding: 0 20px; border-radius: 25px; background: var(--panel); border: 1.5px solid var(--line);
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-edge); }
.pill:active { transform: translateY(2px); }
.spacer { flex: 1; }

#board { width: min(100%, calc((100dvh - var(--st) - var(--sb) - 230px) * .8)); margin: 18px auto 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; perspective: 900px; }
.card { position: relative; aspect-ratio: 1; padding: 0; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .42s cubic-bezier(.3,.7,.3,1); }
.card.open .inner, .card.done .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.back { background: var(--card); box-shadow: 0 5px 0 var(--card-edge); display: grid; place-items: center;
  background-image: radial-gradient(circle at 30% 20%, rgba(255,255,255,.13), transparent 60%); }
.back b { color: var(--card-ink); font: italic 700 clamp(15px, 5.2vw, 26px)/1 var(--serif); letter-spacing: .01em;
  text-shadow: 0 1px 0 rgba(0,0,0,.18); }
.front { transform: rotateY(180deg); background-color: #ddd; background-repeat: no-repeat; box-shadow: 0 5px 0 #b9b0a3; }
.card.done .front { box-shadow: 0 5px 0 var(--ok); }
.card.done .front::after { content: ''; position: absolute; inset: 0; border-radius: 12px; border: 3px solid var(--ok); }
.card.pop .inner { animation: pop .45s ease .1s; }
@keyframes pop { 0%,100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.08); } }
.card.miss .front { animation: shake .35s ease; }
@keyframes shake { 0%,100% { transform: rotateY(180deg) translateX(0); } 30% { transform: rotateY(180deg) translateX(-4px); } 70% { transform: rotateY(180deg) translateX(4px); } }

.score { margin-top: 20px; border-radius: 18px; background: linear-gradient(90deg, transparent, var(--accent-soft) 20%, var(--accent-soft) 80%, transparent);
  display: flex; justify-content: center; gap: 28px; padding: 8px 10px; font-size: 22px; }
.score small { color: var(--muted); font-size: 15px; display: block; text-align: center; }
.score div { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.hint { margin-top: 12px; text-align: center; color: var(--muted); font-size: 14px; }
.hint button { color: var(--accent); font-weight: 600; text-decoration: underline; }

/* ---------- Gewonnen ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,16,12,.45); display: grid; place-items: center; padding: 20px; z-index: 20;
  animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--panel); border-radius: 22px; padding: 26px 22px 20px; width: min(360px, 100%); text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: up .3s cubic-bezier(.3,.7,.3,1); }
@keyframes up { from { transform: translateY(20px) scale(.97); } }
.dialog h2 { margin: 0 0 6px; font: 700 28px/1.1 var(--serif); }
.dialog p { margin: 6px 0; color: var(--muted); }
.dialog .big { font-size: 46px; font-weight: 700; color: var(--accent); margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.dialog .row { display: flex; gap: 10px; margin-top: 18px; }
.dialog .row .pill { flex: 1; justify-content: center; }
.dialog input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); margin-top: 10px; text-align: center; -webkit-user-select: text; user-select: text; }
.err { color: #c43d3d; font-size: 14px; min-height: 20px; margin-top: 6px; }

/* ---------- Fundus ---------- */
#fundus { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; }
.ftop { display: flex; align-items: center; gap: 10px; padding: calc(var(--st) + 12px) 16px 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.ftop h2 { margin: 0; flex: 1; font: 700 24px/1.1 var(--serif); }
.ftop h2 small { display: block; font: 500 13px/1.3 -apple-system, system-ui, sans-serif; color: var(--muted); margin-top: 2px; }
.fscroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.fbody { max-width: 560px; margin: 0 auto; padding: 6px 16px calc(var(--sb) + 24px); }
.fadd { width: 100%; justify-content: center; margin: 4px 0 8px; }
.fnote { color: var(--muted); font-size: 14px; margin: 6px 2px 14px; }
#thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.thumb { aspect-ratio: 1; border-radius: 10px; background-color: var(--line); background-repeat: no-repeat; position: relative; }
.thumb:active { transform: scale(.96); }
.thumb.busy::after { content: ''; position: absolute; inset: 0; border-radius: 10px; background: rgba(255,255,255,.5); }
.progress { margin: 0 0 12px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.ptext { font-size: 14px; color: var(--muted); margin-bottom: 4px; }

/* ---------- Zuschnitt ---------- */
#crop .dialog { width: min(400px, 100%); }
.cropbox { position: relative; width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #000; touch-action: none; margin-top: 10px; }
.cropbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cropbox::after { content: ''; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); pointer-events: none; }
.zoom { width: 100%; margin-top: 14px; accent-color: var(--accent); }
.linkish { color: var(--muted); font-size: 14px; margin-top: 10px; text-decoration: underline; }
.danger { color: #c43d3d; }
</style>
</head>
<body>

<main id="game">
  <header>
    <h1><span id="roundLabel">Runde 1</span>Louises Memory</h1>
    <div class="tools">
      <button class="round-btn" id="btnFundus" aria-label="Bilderfundus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      </button>
      <button class="round-btn" id="btnStats" aria-label="Statistik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="14" width="4" height="6" rx="1"/></svg>
      </button>
      <button class="round-btn accent" id="btnNew" aria-label="Neues Spiel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>
  <div id="board"></div>
  <div class="score">
    <div><small>Versuche</small><span id="tries">0</span></div>
    <div><small>Paare</small><span id="pairs">0 / 10</span></div>
  </div>
  <div class="hint" id="hint"></div>
</main>

<section id="fundus" class="hidden">
  <div class="ftop">
    <button class="round-btn" id="btnBack" aria-label="Zurück zum Spiel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>Bilderfundus<small id="fcount"></small></h2>
  </div>
  <div class="fscroll"><div class="fbody">
    <label class="pill primary fadd" id="addLabel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Fotos hinzufügen
      <input type="file" id="fileIn" accept="image/*" multiple class="hidden">
    </label>
    <div id="upProg" class="hidden"><div class="ptext" id="upText"></div><div class="progress"><div id="upBar"></div></div></div>
    <p class="fnote" id="fnote">Fotos werden automatisch quadratisch zugeschnitten, mit Zoom auf Gesichter und Motive. Tippe auf ein Bild, um den Ausschnitt anzupassen oder es zu löschen.</p>
    <div id="thumbs"></div>
  </div></div>
</section>

<div id="modal"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
